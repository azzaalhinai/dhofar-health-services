<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#E6EDF6">
<title>Dhofar Health Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>/* ================= TOKENS ================= */
:root{
  --u: min(100vw / 1280, 100vh / 960);
  --t: var(--u);
  --pad: 0;
  --ink:#020C21; --ink-soft:#0F182F; --ink-2:#39455F; --muted:#59627E; --muted2:#4D5B77;
  --frame:#E6EDF6; --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#F6F8FB; --line:rgba(15,27,49,.09); --line-2:rgba(15,27,49,.16);
  --cta:#0F1B31; --cta-ink:#fff; --cta-knob:#384B64; --meet-knob:#1A2B45;
  --accent:#4A78B0; --track:#DDE4EE; --track-fill:#5F88B4;
  --glass:rgba(255,255,255,.78); --glass-brd:rgba(255,255,255,.85); --glass-ring:rgba(120,145,180,.2);
  --panel-a:rgba(255,255,255,.44); --panel-b:rgba(255,255,255,.16); --panel-brd:rgba(255,255,255,.6);
  --nav-ink:#202940; --nav-div:#CED5E0;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6;
  --q100:#cde2fb; --q250:#86b6ef; --q400:#3987e5; --q550:#1c5cab; --q700:#0d366b;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --info:#2a78d6; --none:#9aa3b5;
  --good-bg:rgba(12,163,12,.10); --warn-bg:rgba(250,178,25,.16); --serious-bg:rgba(236,131,90,.15); --crit-bg:rgba(208,59,59,.11); --info-bg:rgba(42,120,214,.10); --none-bg:rgba(120,130,150,.10);
  --shadow:0 1px 2px rgba(15,27,49,.04),0 8px 24px rgba(15,27,49,.05);
  --plate-1:#F4F7FB; --plate-2:#DCE6F2; --plate-3:#C9D7EA;
  --font:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@supports (height:100dvh){:root{--u: min(100vw / 1280, 100dvh / 960)}}
:root[data-theme="dark"]{
  --ink:#EEF3FA; --ink-soft:#DCE4F0; --ink-2:#B9C4D8; --muted:#8C98B0; --muted2:#9AA6BD;
  --frame:#081020; --bg:#0A1120; --surface:#111A2B; --surface-2:#162236; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --cta:#E8EEF7; --cta-ink:#0B1424; --cta-knob:#C3CFE0; --meet-knob:#2F4566;
  --accent:#6E9BD3; --track:#26344B; --track-fill:#6E9BD3;
  --glass:rgba(22,33,52,.62); --glass-brd:rgba(255,255,255,.10); --glass-ring:rgba(140,170,215,.16);
  --panel-a:rgba(40,56,84,.48); --panel-b:rgba(20,30,48,.30); --panel-brd:rgba(255,255,255,.12);
  --nav-ink:#DCE4F0; --nav-div:#33445F;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9;
  --q100:#184f95; --q250:#256abf; --q400:#3987e5; --q550:#6da7ec; --q700:#b7d3f6;
  --none:#5d6880;
  --good-bg:rgba(12,163,12,.16); --warn-bg:rgba(250,178,25,.14); --serious-bg:rgba(236,131,90,.16); --crit-bg:rgba(208,59,59,.20); --info-bg:rgba(57,135,229,.16); --none-bg:rgba(150,160,180,.10);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  --plate-1:#0F1A2E; --plate-2:#0A1324; --plate-3:#060C18;
  color-scheme:dark;
}
:root[lang="ar"]{ --font:"IBM Plex Sans Arabic","Inter",Tahoma,sans-serif }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-synthesis:none;
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;transition:background .3s}
body.is-home{overflow:hidden;background:var(--frame)}
button{font:inherit;color:inherit}
a{color:inherit}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ================= HERO (design-unit system) ================= */
.page{position:fixed;inset:0;background:var(--frame);display:none}
body.is-home .page{display:block}
body.is-home #app{display:none}
.card{position:absolute;inset:0;isolation:isolate;overflow:hidden}
.plate{position:absolute;inset:-2px;z-index:0;
  background:
   radial-gradient(120% 90% at 50% 40%, var(--plate-1) 0%, var(--plate-2) 55%, var(--plate-3) 100%)}
.plate::after{content:"";position:absolute;inset:0;opacity:.5;
  background:radial-gradient(60% 40% at 50% 100%, rgba(74,120,176,.10), transparent 70%)}
.tint{position:absolute;inset:0;background:rgba(255,249,240,.05);z-index:1;pointer-events:none}
:root[data-theme="dark"] .tint{background:rgba(10,20,40,.15)}

/* glass orb — original replacement for the video plate */
.stage{position:absolute;left:50%;top:47%;width:calc(560*var(--u));height:calc(560*var(--u));
  transform:translate(-50%,-50%);z-index:0;pointer-events:none}
.orb{position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 30% 26%, rgba(255,255,255,.98) 0 4%, rgba(255,255,255,.55) 9%, transparent 24%),
    radial-gradient(circle at 72% 80%, rgba(150,185,230,.55), transparent 50%),
    radial-gradient(circle at 50% 55%, rgba(236,242,250,.25) 0%, rgba(190,210,236,.55) 62%, rgba(255,255,255,.92) 99%);
  box-shadow:inset 0 0 calc(70*var(--u)) rgba(255,255,255,.85),
    inset calc(-34*var(--u)) calc(-44*var(--u)) calc(90*var(--u)) rgba(74,120,176,.28),
    0 calc(50*var(--u)) calc(90*var(--u)) rgba(28,52,92,.13)}
.orb::before{content:"";position:absolute;inset:6%;border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0 12%, rgba(255,255,255,.55) 16%, transparent 22% 48%, rgba(160,200,245,.45) 54%, transparent 60% 80%, rgba(255,255,255,.4) 86%, transparent 90%);
  filter:blur(calc(14*var(--u)));mix-blend-mode:soft-light;animation:spin 28s linear infinite}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:inset 0 0 0 calc(1.2*var(--u)) rgba(255,255,255,.75), inset 0 calc(-10*var(--u)) calc(30*var(--u)) rgba(255,255,255,.6)}
.blade{position:absolute;left:50%;top:50%;border-radius:calc(6*var(--u));
  background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,.6) 50%,rgba(255,255,255,.18));
  border:calc(1*var(--u)) solid rgba(255,255,255,.7);
  -webkit-backdrop-filter:blur(calc(6*var(--u))) saturate(120%);backdrop-filter:blur(calc(6*var(--u))) saturate(120%);
  box-shadow:0 calc(10*var(--u)) calc(30*var(--u)) rgba(28,52,92,.08)}
.blade.v{width:calc(22*var(--u));height:calc(720*var(--u));transform:translate(-50%,-50%) rotate(-14deg)}
.blade.h{width:calc(620*var(--u));height:calc(22*var(--u));transform:translate(-50%,-50%) rotate(-14deg);opacity:.65}
.floor{position:absolute;left:50%;top:100%;width:80%;height:calc(60*var(--u));transform:translate(-50%,-30%);
  background:radial-gradient(closest-side,rgba(28,52,92,.16),transparent);filter:blur(calc(6*var(--u)))}
:root[data-theme="dark"] .orb{
  background:
    radial-gradient(circle at 30% 26%, rgba(220,235,255,.75) 0 3%, rgba(160,195,240,.30) 9%, transparent 24%),
    radial-gradient(circle at 72% 80%, rgba(57,135,229,.45), transparent 52%),
    radial-gradient(circle at 50% 55%, rgba(30,50,85,.25) 0%, rgba(40,70,120,.45) 62%, rgba(150,190,240,.55) 99%);
  box-shadow:inset 0 0 calc(70*var(--u)) rgba(120,170,235,.25), inset calc(-34*var(--u)) calc(-44*var(--u)) calc(90*var(--u)) rgba(57,135,229,.25), 0 0 calc(140*var(--u)) rgba(57,135,229,.18)}
:root[data-theme="dark"] .orb::after{box-shadow:inset 0 0 0 calc(1.2*var(--u)) rgba(170,205,250,.35)}
:root[data-theme="dark"] .blade{background:linear-gradient(90deg,rgba(150,190,240,.06),rgba(170,205,250,.25) 50%,rgba(150,190,240,.06));border-color:rgba(170,205,250,.25)}
:root[data-theme="dark"] .floor{background:radial-gradient(closest-side,rgba(57,135,229,.18),transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translate(-50%,calc(-50% - 8*var(--u)))}}
@media (prefers-reduced-motion:no-preference){ .stage{animation:float 11s ease-in-out infinite} }
@media (prefers-reduced-motion:reduce){ .orb::before{animation:none} }

/* absolute helper system — logical properties so RTL mirrors itself */
.stack,.row,.hero-blk,.tagrow,.stats,.stat{display:contents}
.l{position:absolute;z-index:2}
.t{inset-inline-start:calc((var(--x) + 13)*var(--u));top:calc((var(--y) + 15)*var(--u))}
.c{inset-inline-start:calc((var(--x) + 13)*var(--u));top:calc(50% + (var(--y) - 2)*var(--u))}
.b{inset-inline-start:calc((var(--x) + 13)*var(--u));bottom:calc((var(--y) + 19)*var(--u))}
.r{inset-inline-start:auto;inset-inline-end:calc((var(--x) + 19)*var(--u))}
.sx{display:inline-block;transform-origin:left top;transform:scaleX(var(--sx,1))}
[dir="rtl"] .sx{transform-origin:right top}
[dir="rtl"] .flip{transform:scaleX(-1)}

.brand{display:flex;align-items:center;text-decoration:none;color:inherit;height:calc(39*var(--u))}
.mark{width:calc(39*var(--u));height:calc(39*var(--u));display:block;flex:none;color:var(--ink)}
.brand b{font-size:calc(22*var(--u));font-weight:520;letter-spacing:-0.03em;line-height:1;margin-inline-start:calc(7.7*var(--u));white-space:nowrap}
[lang="ar"] .brand b{letter-spacing:0;font-weight:600}

.nav{position:absolute;left:50%;transform:translateX(calc(-50% - 3*var(--u)));top:calc((31 + 15)*var(--u));
  width:calc(293*var(--u));height:calc(67*var(--u));border-radius:999px;background:var(--glass);
  border:calc(1*var(--u)) solid var(--glass-brd);
  -webkit-backdrop-filter:blur(calc(40*var(--u)));backdrop-filter:blur(calc(40*var(--u)));
  box-shadow:0 0 0 calc(1.3*var(--u)) var(--glass-ring),0 calc(2*var(--u)) calc(10*var(--u)) rgba(28,52,92,.05);z-index:2;
  display:flex;align-items:center;justify-content:center;gap:calc(14*var(--u))}
.nav a{display:flex;align-items:center;gap:calc(10*var(--u));text-decoration:none;padding:calc(8*var(--u)) calc(4*var(--u))}
.nav span{font-size:calc(15*var(--u));font-weight:570;letter-spacing:-0.04em;line-height:1;color:var(--nav-ink);white-space:nowrap}
[lang="ar"] .nav span{letter-spacing:0;font-size:calc(16*var(--u))}
.nav svg{width:calc(21*var(--u));height:calc(21*var(--u));display:block;flex:none}
.nav hr{width:calc(1.5*var(--u));height:calc(31*var(--u));background:var(--nav-div);border:0;margin:0 calc(6*var(--u))}

.cta{width:calc(236*var(--u));height:calc(70*var(--u));border-radius:999px;background:var(--cta);text-decoration:none;display:block;
  box-shadow:0 calc(10*var(--u)) calc(24*var(--u)) rgba(11,26,50,.18)}
.cta span{position:absolute;inset-inline-start:calc(32*var(--u));top:50%;transform:translateY(-50%);
  font-size:calc(17.5*var(--u));font-weight:400;letter-spacing:-0.03em;line-height:1;color:var(--cta-ink);white-space:nowrap}
[lang="ar"] .cta span{letter-spacing:0;font-weight:500}
.knob{position:absolute;border-radius:50%;background:var(--cta-knob);display:flex;align-items:center;justify-content:center}
.cta .knob{inset-inline-end:calc(10.5*var(--u));top:calc(10.5*var(--u));width:calc(49*var(--u));height:calc(49*var(--u))}
.knob svg{width:calc(17*var(--u));height:calc(17*var(--u))}
.knob{color:#fff}
:root[data-theme="dark"] .cta .knob{color:#0B1424}

.toggles{display:flex;gap:calc(8*var(--u))}
.tg{width:calc(52*var(--u));height:calc(52*var(--u));border-radius:999px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;background:var(--glass);border:calc(1*var(--u)) solid var(--glass-brd);
  -webkit-backdrop-filter:blur(calc(40*var(--u)));backdrop-filter:blur(calc(40*var(--u)));
  box-shadow:0 0 0 calc(1.3*var(--u)) var(--glass-ring);color:var(--nav-ink);font-size:calc(15*var(--u));font-weight:600}
.tg svg{width:calc(20*var(--u));height:calc(20*var(--u))}

.eyebrow{font-size:calc(16*var(--u));font-weight:470;letter-spacing:-0.015em;line-height:1;color:var(--muted);white-space:nowrap}
.hero h1{font-size:calc(92*var(--u));font-weight:360;letter-spacing:-0.035em;line-height:calc(90*var(--u));color:var(--ink);white-space:nowrap}
[lang="ar"] .hero h1{letter-spacing:0;font-weight:400;font-size:calc(84*var(--u));line-height:calc(100*var(--u))}
[lang="ar"] .eyebrow,[lang="ar"] .tag{letter-spacing:0}
.play{width:calc(50.5*var(--u));height:calc(50.5*var(--u));border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;
  box-shadow:0 calc(6*var(--u)) calc(18*var(--u)) rgba(28,52,92,.10);text-decoration:none}
.play svg{width:calc(13*var(--u));height:calc(14*var(--u))}
.play path{fill:var(--ink)}
.tag{font-size:calc(22*var(--u));font-weight:470;letter-spacing:-0.03em;line-height:1;color:var(--ink-soft);white-space:nowrap}

.panel{width:calc(275*var(--u));height:calc(271*var(--u));border-radius:calc(28*var(--u));
  background:linear-gradient(135deg,var(--panel-a),var(--panel-b));border:calc(1*var(--u)) solid var(--panel-brd);
  -webkit-backdrop-filter:blur(calc(40*var(--u))) saturate(112%);backdrop-filter:blur(calc(40*var(--u))) saturate(112%);
  box-shadow:inset calc(1*var(--u)) calc(1*var(--u)) 0 rgba(255,255,255,.35),0 calc(18*var(--u)) calc(40*var(--u)) rgba(28,52,92,.07);
  text-decoration:none;color:inherit;display:block}
.panel>*{position:absolute}
.p-title{inset-inline-start:calc(29*var(--u));top:calc(44.7*var(--u));font-size:calc(24*var(--u));font-weight:500;letter-spacing:-0.02em;line-height:1;color:var(--ink);white-space:nowrap}
.dot{inset-inline-start:calc(150*var(--u));top:calc(36*var(--u));width:calc(10*var(--u));height:calc(10*var(--u));border-radius:50%;background:var(--accent)}
.shield{inset-inline-start:calc(177*var(--u));top:calc(46*var(--u));width:calc(73*var(--u));height:calc(73*var(--u));border-radius:50%;
  background:var(--surface);display:flex;align-items:center;justify-content:center;opacity:.95;
  box-shadow:0 0 calc(26*var(--u)) calc(10*var(--u)) rgba(255,255,255,.35),0 calc(6*var(--u)) calc(16*var(--u)) rgba(28,52,92,.06)}
:root[data-theme="dark"] .shield{box-shadow:0 0 calc(26*var(--u)) calc(6*var(--u)) rgba(57,135,229,.18)}
.shield svg{width:calc(32*var(--u));height:calc(36*var(--u))}
.shield{color:var(--ink)}
.p-sub{inset-inline-start:calc(29*var(--u));top:calc(94.35*var(--u));font-size:calc(17*var(--u));font-weight:400;letter-spacing:-0.02em;line-height:calc(21*var(--u));color:var(--muted2)}
.scale{inset-inline-start:calc(46*var(--u));top:calc(189*var(--u));width:calc(190*var(--u));display:flex;justify-content:space-between;
  font-size:calc(14*var(--u));letter-spacing:-0.03em;line-height:1;color:var(--muted)}
.track{inset-inline-start:calc(46*var(--u));top:calc(221*var(--u));width:calc(190*var(--u));height:calc(8*var(--u));border-radius:999px;background:var(--track);overflow:hidden}
.track i{display:block;width:var(--fill,50%);height:100%;border-radius:999px;background:var(--track-fill);transform-origin:left center}
[dir="rtl"] .track i{transform-origin:right center}

.num{font-size:calc(80*var(--u));font-weight:200;line-height:1;color:var(--ink);white-space:nowrap;font-family:"Inter",sans-serif;font-variant-numeric:tabular-nums}
.lbl{font-size:calc(19*var(--u));font-weight:400;letter-spacing:-0.02em;line-height:calc(23.5*var(--u));color:var(--ink-2)}
[lang="ar"] .lbl{letter-spacing:0}
.slash{width:calc(23*var(--u));height:calc(75*var(--u));
  background:linear-gradient(to top left,transparent calc(50% - .85*var(--u)),#A7B4C6 calc(50% - .85*var(--u)),#A7B4C6 calc(50% + .85*var(--u)),transparent calc(50% + .85*var(--u)))}
.meet{width:calc(300*var(--u));height:calc(86*var(--u));border-radius:999px;display:block;text-decoration:none;background:var(--panel-b);
  border:calc(1*var(--u)) solid var(--panel-brd);-webkit-backdrop-filter:blur(calc(40*var(--u)));backdrop-filter:blur(calc(40*var(--u)));
  box-shadow:0 0 0 calc(1.2*var(--u)) rgba(120,145,180,.1),inset calc(1*var(--u)) calc(1*var(--u)) 0 rgba(255,255,255,.4),0 calc(8*var(--u)) calc(22*var(--u)) rgba(28,52,92,.035)}
.meet>*{position:absolute}
.thumb{inset-inline-start:calc(12*var(--u));top:calc(11*var(--u));width:calc(64*var(--u));height:calc(64*var(--u));border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 32% 28%,#fff 0 6%,transparent 26%),radial-gradient(circle at 70% 78%,rgba(120,160,215,.6),transparent 55%),radial-gradient(circle,#e6eef9,#b9cde8);
  box-shadow:inset 0 0 0 calc(1*var(--u)) rgba(255,255,255,.45)}
.meet b{inset-inline-start:calc(89.8*var(--u));top:50%;transform:translateY(-50%);font-size:calc(17.5*var(--u));font-weight:425;letter-spacing:-0.04em;line-height:1;color:var(--ink-soft);white-space:nowrap}
[lang="ar"] .meet b{letter-spacing:0;font-weight:500}
.meet .knob{inset-inline-end:calc(18*var(--u));top:calc(17*var(--u));width:calc(50*var(--u));height:calc(50*var(--u));background:var(--meet-knob)}
.burger{display:none}

@media (prefers-reduced-motion:no-preference){
  .cta,.meet,.panel,.play{transition:transform .35s cubic-bezier(.2,.7,.3,1)}
  .cta:hover,.meet:hover,.panel:hover,.play:hover{transform:translateY(calc(-2*var(--u)))}
  .cta:hover span{transform:translateY(-50%)}
}
a:focus-visible,button:focus-visible{outline:2px solid #2f5f9e;outline-offset:3px}

/* narrower desktop windows (narrower than about 16:10): stack each stat label under its number so the row clears the CTA */
@media (min-aspect-ratio: 88/80) and (max-aspect-ratio: 79/50) and (min-width: 900px) and (min-height: 640px){
  #heroN1{--x:64!important;--y:76.5!important} .lbl[data-i="heroL1"]{--x:64!important;--y:0!important}
  #heroN2{--x:252!important;--y:76.5!important} .lbl[data-i="heroL2"]{--x:252!important;--y:0!important}
  #heroN3{--x:548!important;--y:76.5!important} .lbl[data-i="heroL3"]{--x:548!important;--y:0!important}
  .stats .slash:nth-of-type(1){--x:206!important;--y:62!important}
  .stats .slash:nth-of-type(2){--x:496!important;--y:62!important}
}

/* ---- compact tier ---- */
@media (max-aspect-ratio: 87/80), (max-width: 899px), (max-height: 639px){
  :root{--u: min(100vw / 880, 100vh / 1220); --pad: 52}
  @supports (height:100dvh){:root{--u: min(100vw / 880, 100dvh / 1220)}}
  .stack{display:flex;flex-direction:column;justify-content:space-between;position:absolute;inset:0;z-index:2;padding:calc(var(--pad)*var(--u))}
  .row,.hero-blk,.stats,.stat,.tagrow{display:flex}
  .row{align-items:center;justify-content:space-between;width:100%;gap:calc(14*var(--u))}
  .hero-blk{flex-direction:column;align-items:flex-start;width:100%;margin:calc(30*var(--u)) 0}
  .tagrow{align-items:center;gap:calc(16*var(--u));margin-top:calc(28*var(--u))}
  .stats{display:grid;grid-template-columns:repeat(5,auto);align-items:center;justify-content:start;gap:calc(24*var(--u))}
  .stat{flex-direction:column;align-items:flex-start;gap:calc(8*var(--u))}
  .l,.t,.c,.b,.r{position:relative;inset:auto}
  .hero h1{margin-top:calc(16*var(--u))}
  .play{flex:none}
  .panel{align-self:flex-end;margin-top:calc(36*var(--u))}
  .row:last-child{flex-wrap:wrap;row-gap:calc(24*var(--u))}
  .meet{margin-inline-start:auto}
  .nav{position:relative;left:auto;top:auto;transform:none;flex:none}
  .head-end{display:flex;align-items:center;gap:calc(12*var(--u))}
  @media (min-aspect-ratio: 1/1){
    :root{--u: min(100vw / 1240, 100vh / 820); --pad: 46}
    @supports (height:100dvh){:root{--u: min(100vw / 1240, 100dvh / 820)}}
    @media (max-height: 520px){
      :root{--u: min(100vw / 900, 100vh / 560); --pad: 30}
      @supports (height:100dvh){:root{--u: min(100vw / 900, 100dvh / 560)}}
    }
    .hero-blk{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:calc(46*var(--u));align-items:end;margin:calc(24*var(--u)) 0}
    .eyebrow{grid-column:1;grid-row:1}
    .hero h1{grid-column:1;grid-row:2}
    .tagrow{grid-column:1;grid-row:3}
    .panel{grid-column:2;grid-row:1 / span 3;align-self:center;margin-top:0}
    .row:last-child{flex-wrap:nowrap}
  }
  @media (max-width: 640px) and (max-aspect-ratio: 1/1){
    :root{--u: min(100vw / 600, 100vh / 940); --t: max(var(--u), min(0.85px, 100vh / 780)); --pad: 40}
    @supports (height:100dvh){:root{--u: min(100vw / 600, 100dvh / 940); --t: max(var(--u), min(0.85px, 100dvh / 780))}}
    .sx{transform:none}
    .brand{height:auto}
    .mark{width:calc(34*var(--t));height:calc(34*var(--t))}
    .brand b{font-size:calc(19*var(--t));margin-inline-start:calc(8*var(--t))}
    .hero h1{font-size:calc(64*var(--u));line-height:calc(66*var(--u));margin-top:calc(12*var(--u));white-space:normal}
    .eyebrow{font-size:calc(15*var(--t));white-space:normal}
    .tagrow{gap:calc(14*var(--t));margin-top:calc(22*var(--u))}
    .tag{font-size:calc(17*var(--t));line-height:calc(23*var(--t));white-space:normal}
    .play{width:calc(48*var(--t));height:calc(48*var(--t))}
    .panel{width:100%;align-self:stretch;height:calc(212*var(--t));margin-top:calc(24*var(--u))}
    .p-title{inset-inline-start:calc(30*var(--t));top:calc(30*var(--t));font-size:calc(22*var(--t))}
    .dot{inset-inline-start:calc(150*var(--t));top:calc(28*var(--t));width:calc(10*var(--t));height:calc(10*var(--t))}
    .shield{inset-inline-start:auto;inset-inline-end:calc(26*var(--t));top:calc(22*var(--t));width:calc(64*var(--t));height:calc(64*var(--t))}
    .shield svg{width:calc(28*var(--t));height:calc(32*var(--t))}
    .p-sub{inset-inline-start:calc(31*var(--t));top:calc(72*var(--t));font-size:calc(15*var(--t));line-height:calc(19*var(--t))}
    .scale{inset-inline-start:calc(31*var(--t));top:calc(150*var(--t));width:calc(100% - 62*var(--t));font-size:calc(13*var(--t))}
    .track{inset-inline-start:calc(31*var(--t));top:calc(178*var(--t));width:calc(100% - 62*var(--t));height:calc(8*var(--t))}
    .stats{display:grid;grid-template-columns:auto auto auto auto auto;justify-content:space-between;align-items:center;gap:calc(6*var(--u));width:100%}
    .stat{flex-direction:column;align-items:flex-start;gap:calc(6*var(--t))}
    .num{font-size:calc(52*var(--u))}
    .lbl{font-size:calc(14*var(--t));line-height:calc(18*var(--t))}
    .slash{height:calc(72*var(--t));width:calc(20*var(--t));align-self:center}
    .meet{width:100%;height:calc(72*var(--t))}
    .thumb{inset-inline-start:calc(9*var(--t));top:calc(5*var(--t));width:calc(62*var(--t));height:calc(62*var(--t))}
    .meet b{inset-inline-start:calc(84*var(--t));font-size:calc(17*var(--t))}
    .meet .knob{inset-inline-start:auto;inset-inline-end:calc(11*var(--t));top:calc(11*var(--t));width:calc(50*var(--t));height:calc(50*var(--t))}
    .tg{width:calc(46*var(--t));height:calc(46*var(--t));font-size:calc(14*var(--t))}
    .tg svg{width:calc(18*var(--t));height:calc(18*var(--t))}
    .stage{width:calc(520*var(--u));height:calc(520*var(--u));top:40%}
  }
}
/* nav collapse — portrait */
.menu{display:contents}
.burger{align-items:center;justify-content:center;flex-direction:column;gap:calc(6*var(--t));width:calc(52*var(--t));height:calc(52*var(--t));
  border-radius:999px;padding:0;cursor:pointer;background:var(--glass);border:1px solid var(--glass-brd);
  -webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);box-shadow:0 0 0 1px var(--glass-ring)}
.burger i{display:block;width:calc(20*var(--t));height:calc(1.8*var(--t));border-radius:999px;background:var(--nav-ink);transition:transform .3s cubic-bezier(.2,.7,.3,1)}
.burger[aria-expanded="true"] i:first-child{transform:translateY(calc(3.9*var(--t))) rotate(45deg)}
.burger[aria-expanded="true"] i:last-child{transform:translateY(calc(-3.9*var(--t))) rotate(-45deg)}
@media (max-aspect-ratio: 1/1){
  .burger{display:flex}
  .menu{display:block;position:absolute;z-index:9;top:calc(var(--pad)*var(--u) + 68*var(--t));inset-inline-end:calc(var(--pad)*var(--u));
    width:calc(320*var(--t));padding:calc(14*var(--t));border-radius:calc(28*var(--t));background:var(--glass);border:1px solid var(--glass-brd);
    -webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);box-shadow:0 0 0 1px var(--glass-ring),0 16px 34px rgba(28,52,92,.12);
    opacity:0;visibility:hidden;transform:translateY(-10px) scale(.97);transform-origin:top right;transition:opacity .26s,transform .26s,visibility .26s}
  [dir="rtl"] .menu{transform-origin:top left}
  .menu[data-open]{opacity:1;visibility:visible;transform:none}
  .menu .nav{position:relative;left:auto;top:auto;transform:none;width:100%;height:auto;display:flex;flex-direction:column;align-items:stretch;gap:calc(4*var(--t));
    padding:calc(4*var(--t));border:0;background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .menu .nav a{padding:calc(10*var(--t))}
  .menu .nav span{font-size:calc(17*var(--t))}
  .menu .nav svg{width:calc(21*var(--t));height:calc(21*var(--t))}
  .menu .nav hr{width:100%;height:1px;margin:calc(4*var(--t)) 0}
  .menu .cta{position:relative;inset:auto;width:100%;height:calc(60*var(--t));margin-top:calc(10*var(--t))}
  .menu .cta span{inset-inline-start:calc(26*var(--t));font-size:calc(17*var(--t))}
  .menu .cta .knob{inset-inline-start:auto;inset-inline-end:calc(7*var(--t));top:calc(6*var(--t));width:calc(48*var(--t));height:calc(48*var(--t))}
  .menu .cta .knob svg{width:calc(16*var(--t));height:calc(16*var(--t))}
}

/* entrance pre-states */
html.pre .brand,html.pre .nav,html.pre .cta,html.pre .toggles,html.pre .burger,html.pre .eyebrow,html.pre .play,html.pre .tag,html.pre .panel,html.pre .lbl,html.pre .meet,html.pre .stage{opacity:0}
html.pre .hero h1 .sx,html.pre .num{clip-path:inset(100% 0 -14% 0)}
html.pre .slash{scale:1 0}
html.pre .track i{scale:0 1}
html.pre .dot{scale:0}

/* ================= APP SHELL ================= */
#app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px}
.top .brand{height:auto;flex:none}
.top .mark{width:30px;height:30px}
.top .brand b{font-size:17px;margin-inline-start:9px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs a{white-space:nowrap;text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);padding:8px 12px;border-radius:999px;transition:background .2s,color .2s}
.tabs a:hover{color:var(--ink);background:var(--surface-2)}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--line),var(--shadow)}
.top .toggles{gap:6px;flex:none}
.top .tg{width:38px;height:38px;font-size:13px;border-width:1px;box-shadow:0 0 0 1px var(--line);background:var(--surface)}
.top .tg svg{width:17px;height:17px}

main{flex:1;max-width:1320px;width:100%;margin:0 auto;padding:28px 24px 64px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:8px 0 22px}
.view-head h2{font-size:34px;font-weight:400;letter-spacing:-.03em;line-height:1.1}
[lang="ar"] .view-head h2{letter-spacing:0;font-weight:500}
.view-head p{color:var(--muted);font-size:15px;max-width:640px;margin-top:8px;line-height:1.55}
.eyebrow-s{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
[lang="ar"] .eyebrow-s{letter-spacing:0}

.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-12{grid-template-columns:repeat(12,minmax(0,1fr))}
.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
@media (max-width:1000px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 12}}
@media (max-width:620px){.g-3,.g-2{grid-template-columns:minmax(0,1fr)} .g-4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi .k-v{font-size:30px} .box{padding:16px;border-radius:18px} main{padding:20px 14px 56px}
  .top-in{padding:10px 14px;gap:10px;flex-wrap:wrap} .top .tabs{order:3;flex-basis:100%;margin:0 -4px} .top .toggles{margin-inline-start:auto}
  .view-head h2{font-size:27px} .bar-row{grid-template-columns:minmax(90px,120px) 1fr 44px;font-size:12.5px}}

.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);min-width:0}
.box h3{font-size:16px;font-weight:600;letter-spacing:-.01em}
.box .sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.box-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.src{font-size:11.5px;color:var(--muted);margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}

.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .k-l{font-size:13px;color:var(--muted);font-weight:500}
.kpi .k-v{font-size:40px;font-weight:300;letter-spacing:-.03em;line-height:1;font-family:"Inter",sans-serif;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12.5px;color:var(--muted)}
.kpi .k-s b{color:var(--ink-2);font-weight:600}

/* bar chart (HTML) */
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr 52px;align-items:center;gap:10px;font-size:13px;border-radius:8px;padding:2px 4px;margin:0 -4px}
.bar-row:hover{background:var(--surface-2)}
.bar-row .bl{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bv{text-align:end;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.bar-track{height:14px;display:flex;gap:2px;align-items:center}
.seg{height:14px;border-radius:2px;min-width:2px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.seg:last-child{border-start-end-radius:4px;border-end-end-radius:4px}
.bar-row.clickable{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ring{background:transparent!important;border:2px solid var(--muted)}

.dumb{position:relative;height:18px}
.dumb .ln{position:absolute;top:8px;height:2px;background:var(--line-2);border-radius:2px}
.dumb .pt{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;margin-inline-start:-6px;box-shadow:0 0 0 2px var(--surface)}

/* chips & status */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;line-height:1.4}
.chip svg{width:12px;height:12px;flex:none}
.st-good{background:var(--good-bg);color:var(--ink)} .st-good svg{color:var(--good)}
.st-warn{background:var(--warn-bg);color:var(--ink)} .st-warn svg{color:#c98500}
.st-serious{background:var(--serious-bg);color:var(--ink)} .st-serious svg{color:var(--serious)}
.st-crit{background:var(--crit-bg);color:var(--ink)} .st-crit svg{color:var(--crit)}
.st-info{background:var(--info-bg);color:var(--ink)} .st-info svg{color:var(--info)}
.st-none{background:var(--none-bg);color:var(--muted)} .st-none svg{color:var(--none)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.input,.select{height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:14px;min-width:0}
.input:focus,.select:focus{outline:2px solid var(--accent);outline-offset:1px}
.seg-ctl{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg-ctl button{border:0;background:none;padding:7px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.06)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:transparent}
.btn svg{width:15px;height:15px}
.count{font-size:13px;color:var(--muted);margin-inline-start:auto}

/* institution cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:12px;
  transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s,border-color .25s;box-shadow:var(--shadow)}
.icard:hover{transform:translateY(-2px);border-color:var(--line-2)}
.icard h4{font-size:15px;font-weight:600;line-height:1.3}
.icard .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:4px}
.domains{display:flex;gap:6px;flex-wrap:wrap}
.dm{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);padding:3px 8px;border-radius:8px;background:var(--surface-2)}
.dm i{width:7px;height:7px;border-radius:50%}
.mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.mini div{font-size:11.5px;color:var(--muted)}
.mini b{display:block;font-size:18px;font-weight:400;color:var(--ink);font-family:"Inter",sans-serif}

/* table */
.tbl-wrap{overflow:auto;border-radius:14px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);position:sticky;top:0;z-index:1}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td.num-c,th.num-c{text-align:end;font-variant-numeric:tabular-nums}
tr.grp td{background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--ink-2)}
tbody tr.rowlink{cursor:pointer}
tbody tr.rowlink:hover td{background:var(--surface-2)}

/* map */
.map svg{width:100%;height:auto;display:block}
.map .bub{cursor:pointer;transition:opacity .2s}
.map .bub:hover circle.c{stroke-width:3}
.map text{font-family:var(--font)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none}
.modal[open]{display:block}
.modal .scrim{position:absolute;inset:0;background:rgba(5,10,20,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(720px,100%);background:var(--bg);border-inline-start:1px solid var(--line);
  overflow:auto;padding:26px;box-shadow:-20px 0 60px rgba(0,0,0,.18);animation:slidein .35s cubic-bezier(.2,.7,.3,1)}
[dir="rtl"] .sheet{animation-name:slidein-r}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
@keyframes slidein-r{from{transform:translateX(-40px);opacity:0}}
.sheet .close{position:sticky;top:0;float:inline-end;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;z-index:2}
.sheet h2{font-size:28px;font-weight:400;letter-spacing:-.02em;margin:4px 0 6px}
.dtabs{display:flex;gap:4px;overflow-x:auto;margin:18px 0;border-bottom:1px solid var(--line)}
.dtabs button{border:0;background:none;padding:10px 12px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{display:block;font-size:20px;font-weight:400;margin-top:4px}
.empty{border:1px dashed var(--line-2);border-radius:16px;padding:22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.empty .btn{margin-top:12px}

/* audits */
.acard{display:flex;flex-direction:column;gap:10px;text-decoration:none}
.acard .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line)}
.acard .ic svg{width:22px;height:22px;color:var(--accent)}
.acard h3{margin-top:4px}
.acard p{font-size:13px;color:var(--muted);line-height:1.5;flex:1}
.acard .go{font-size:13px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:6px}
.ck-sec{margin-top:18px}
.ck-sec h4{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.ck-item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ck-item .id{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.rate{display:inline-flex;gap:3px}
.rate button{border:1px solid var(--line-2);background:var(--surface);min-width:40px;height:30px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.rate button[aria-pressed="true"][data-v="M"]{background:var(--good);color:#fff;border-color:transparent}
.rate button[aria-pressed="true"][data-v="PM"]{background:var(--warn);color:#2a1d00;border-color:transparent}
.rate button[aria-pressed="true"][data-v="NM"]{background:var(--crit);color:#fff;border-color:transparent}
.rate button[aria-pressed="true"][data-v="NA"]{background:var(--none);color:#fff;border-color:transparent}
@media (max-width:620px){.ck-item{grid-template-columns:40px 1fr}.ck-item .rate{grid-column:1 / -1}}
.score-ring{display:flex;align-items:center;gap:16px}
.score-ring > svg{width:92px;height:92px;flex:none}
.pbar{height:8px;background:var(--track);border-radius:999px;overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
textarea.input{height:auto;padding:10px 12px;resize:vertical;width:100%}

.tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-2);border-radius:12px;padding:9px 12px;
  font-size:12.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.15);max-width:280px;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--cta);color:var(--cta-ink);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer .in{max-width:1320px;margin:0 auto;padding:18px 24px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
.note{font-size:13px;color:var(--ink-2);background:var(--info-bg);border-radius:14px;padding:12px 14px;line-height:1.55;display:flex;gap:10px}
.note svg{flex:none;width:18px;height:18px;color:var(--info);margin-top:1px}
.fade-in{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.fade-in,.sheet{animation:none}}

/* ===== background video plate ===== */
.bg{position:absolute;left:-2px;top:-2px;width:calc(100vw + 4px);height:calc(100vh + 4px);object-fit:cover;object-position:50% 50%;
  z-index:0;filter:brightness(1.006) saturate(.965);transform:scale(1.002);opacity:0;transition:opacity .6s}
@supports (height:100dvh){.bg{height:calc(100dvh + 4px)}}
.has-video .bg{opacity:1}
.has-video .plate,.has-video .stage{display:none}
/* dark theme: re-tone the pale studio plate to deep navy, keeping its hues */
:root[data-theme="dark"] .bg{filter:invert(1) hue-rotate(180deg) brightness(.62) saturate(.9) contrast(1.05)}
:root[data-theme="dark"] .has-video .tint{background:rgba(8,16,32,.22)}

let LANG = document.documentElement.lang === "ar" ? "ar" : "en";
const t = (k, vars) => {
  let v = k.split(".").reduce((o, p) => (o == null ? o : o[p]), T[LANG]);
  if (v == null) v = k.split(".").reduce((o, p) => (o == null ? o : o[p]), T.en);
  if (typeof v === "string" && vars) v = v.replace(/\{(\w+)\}/g, (_, x) => vars[x] != null ? vars[x] : "");
  return v;
};
const nm = i => LANG === "ar" ? i.ar : i.en;
const wn = w => LANG === "ar" ? WILAYAT[w].ar : w;

/* ===================== derived model ===================== */
INST.forEach(i => {
  i.labStatus = typeof i.lab === "number" ? "active" : i.lab === "visit" ? "visit" : i.lab === "plan" ? "plan" : i.lab === "nodata" ? "nodata" : "none";
  i.pending = i.lab === "nodata";
  i.labStaff = typeof i.lab === "number" ? i.lab : 0;
  i.radCur = i.r26 ? i.r26[0] : (i.r25 ? i.r25[0] : 0);
  i.radSrc = i.r26 ? "26" : "25";
  i.radNeed = i.r26 ? i.r26[1] : (i.r25 ? i.r25[1] : 0);
  i.radTarget = i.r25 ? i.r25[4] : i.radCur + i.radNeed;
  i.radNote = i.r26 && i.r26[2] || null;
  const R = RAD[i.id];
  i.R = R ? { hours:R[0], pacs:R[1], tb:R[2], xr:R[3], ct:R[4], months:R[5] === "11m" ? 11 : 9,
    equip: R[6].map(e => ({ type:e[0], vendor:e[1], model:e[2], year:e[3], status:e[4], age:REF_YEAR - e[3] })) } : null;
  if (i.R){ i.R.total = i.R.xr + i.R.ct; i.R.monthly = i.R.xr / i.R.months; }
  i.units = i.R ? i.R.equip.length : 0;
  i.oldest = i.R ? Math.max(...i.R.equip.map(e => e.age)) : null;
  i.condemned = i.R ? i.R.equip.some(e => e.status === "condemn") : false;
});
const WLIST = Object.keys(WILAYAT).sort((a,b) => INST.filter(i=>i.wil===b).length - INST.filter(i=>i.wil===a).length || a.localeCompare(b));
const byWil = w => INST.filter(i => i.wil === w);
const sum = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);
const TOT = {
  inst: INST.length, hosp: INST.filter(i=>i.type==="H").length, hc: INST.filter(i=>i.type==="HC").length,
  poly: INST.filter(i=>i.type==="PC").length, pending: INST.filter(i=>i.pending).length,
  labStaff: sum(INST, i=>i.labStaff), labActive: INST.filter(i=>i.labStatus==="active").length,
  labVisit: INST.filter(i=>i.labStatus==="visit").length, labPlan: INST.filter(i=>i.labStatus==="plan").length,
  radCur: sum(INST, i=>i.radCur), radNeed: sum(INST, i=>i.radNeed), radTarget: sum(INST, i=>i.radTarget),
  exams: sum(INST, i=>i.R && i.R.total), xrayRooms: sum(INST, i=>i.R && i.R.equip.filter(e=>e.type==="xray").length),
  mobile: sum(INST, i=>i.R && i.R.equip.filter(e=>e.type==="mobile").length), ct: sum(INST, i=>i.R && i.R.equip.filter(e=>e.type==="ct").length)
};

const ICON = { good:"i-check", warn:"i-warn", serious:"i-warn", crit:"i-x", info:"i-info", none:"i-dash" };
const chip = (k, label, tip) => `<span class="chip st-${k}"${tip?` data-tip="${esc(tip)}"`:""}><svg aria-hidden="true"><use href="#${ICON[k]}"/></svg>${esc(label)}</span>`;
const DOT = { good:"var(--good)", warn:"var(--warn)", serious:"var(--serious)", crit:"var(--crit)", info:"var(--info)", none:"var(--none)" };
function labSt(i){
  if (i.pending) return ["none", t("stData")];
  if (i.labStatus === "active") return ["good", t("stLabActive",{n:i.labStaff})];
  if (i.labStatus === "visit") return ["warn", t("stLabVisit")];
  if (i.labStatus === "plan") return ["info", t("stLabPlan")];
  return ["none", t("stLabNone")];
}
function radSt(i){
  if (i.pending) return ["none", t("stData")];
  if (i.R || i.radCur > 0){
    return i.radNeed > 0 ? ["serious", t("stRadShort",{n:i.radNeed})] : ["good", t("stRadOk")];
  }
  if (i.radNote) return ["info", t("note_" + i.radNote)];
  if (i.radTarget > 0) return ["info", t("stRadPlan")];
  return ["none", t("stRadNone")];
}
function eqSt(i){
  if (i.pending) return ["none", t("stData")];
  if (!i.R) return ["none", t("stEqNone")];
  if (i.condemned) return ["crit", t("stEqCond")];
  if (i.oldest >= 10) return ["warn", t("stEqOld",{a:i.oldest})];
  return ["good", t("stEqOk",{y:Math.min(...i.R.equip.map(e=>e.year))})];
}
const awaitSt = () => ["none", t("stAwait")];
const domainSt = (i, d) => d === "lab" ? labSt(i) : d === "radiology" ? radSt(i) : awaitSt();
const DOMS = ["general","dental","lab","radiology","mental"];
const DOM_ICON = { general:"i-steth", dental:"i-tooth", lab:"i-lab", radiology:"i-rad", mental:"i-mind" };
const auditUrl = d => AUDITS.find(a => a.key === d).url;

function bars(rows, opt = {}){
  const max = opt.max || Math.max(1, ...rows.map(r => r.segs.reduce((s,g)=>s+g.v,0)));
  return `<div class="bars">${rows.map(r => {
    const tot = r.segs.reduce((s,g)=>s+g.v,0);
    const segs = r.segs.filter(g=>g.v>0).map(g => `<span class="seg" style="width:${(g.v/max*100).toFixed(2)}%;background:${g.c}"></span>`).join("");
    return `<div class="bar-row${r.href?" clickable":""}"${r.href?` data-go="${r.href}"`:""} data-tip="${esc(r.tip || `<b>${esc(r.label)}</b><br>${fmt(tot)}`)}">
      <span class="bl">${esc(r.label)}</span><span class="bar-track">${segs || '<span class="seg" style="width:2px;background:var(--line-2)"></span>'}</span><span class="bv">${r.vLabel != null ? r.vLabel : fmt(tot)}</span></div>`;
  }).join("")}</div>`;
}
const legend = items => `<div class="legend">${items.map(([c,l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join("")}</div>`;
const box = (title, sub, body, cls = "", src = "") => `<section class="box ${cls} fade-in"><div class="box-h"><div><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:""}</div></div>${body}${src?`<p class="src">${esc(t("srcS",{s:src}))}</p>`:""}</section>`;
const kpi = (label, value, sub) => `<div class="box kpi fade-in"><span class="k-l">${label}</span><span class="k-v">${value}</span>${sub?`<span class="k-s">${sub}</span>`:""}</div>`;
const head = (eb, title, sub, right = "") => `<div class="view-head"><div><p class="eyebrow-s">${eb}</p><h2>${title}</h2>${sub?`<p>${sub}</p>`:""}</div>${right}</div>`;

function mapSVG(){
  const W = 600, H = 380;
  const POS = {"Al Mazyunah":[80,150],"Dhalqut":[95,290],"Rakhyut":[185,300],"Salalah":[285,282],"Thumrayt":[290,150],"Taqah":[375,300],"Mirbat":[455,292],"Sadah":[530,250],"Shalim":[505,140],"Muqshin":[385,55]};
  const coast = [[20,330],[120,330],[200,338],[285,330],[375,340],[455,334],[540,300],[575,215],[590,190]];
  const path = coast.map((p,k)=>`${k?"L":"M"}${p[0]} ${p[1]}`).join(" ");
  const bub = WLIST.map(w => {
    const W0 = WILAYAT[w], list = byWil(w), n = list.length, r = 9 + Math.sqrt(n) * 7.5;
    const lab = list.filter(i=>i.labStatus==="active").length;
    const tip = `<b>${esc(wn(w))}</b><br>${n} · ${esc(t("colLabOn"))}: ${lab}/${n}<br>${esc(t("colRad"))}: ${sum(list,i=>i.radCur)}`;
    const lx = POS[w][0], ly = POS[w][1];
    const below = w !== "Muqshin";
    return `<g class="bub" data-wil="${esc(w)}" data-tip="${esc(tip)}" tabindex="0" role="button" aria-label="${esc(wn(w))}">
      <circle class="c" cx="${lx}" cy="${ly}" r="${r}" fill="var(--s1)" fill-opacity=".18" stroke="var(--s1)" stroke-width="2"/>
      <text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${n}</text>
      <text x="${lx}" y="${below ? ly + r + 14 : ly - r - 6}" text-anchor="middle" font-size="12" fill="var(--ink-2)">${esc(wn(w))}</text></g>`;
  }).join("");
  return `<div class="map"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("mapT"))}">
    <path d="${path}" fill="none" stroke="var(--line-2)" stroke-width="1.5" stroke-dasharray="4 5"/>
    <text x="300" y="368" text-anchor="middle" font-size="12" fill="var(--muted)" font-style="italic">${esc(t("sea"))}</text>${bub}</svg></div>`;
}

/* ---------- detail sheet ---------- */
let DETAIL_TAB = "overview";

function closeModal(){ const m = $("#modal"); if (!m.hasAttribute("open")) return; m.removeAttribute("open");
  if (location.hash.startsWith("#inst-")) history.replaceState(null, "", "#institutions"); }
function domainPanel(i, d){
  const [k,l] = domainSt(i,d);
  const auditBtn = `<a class="btn" href="${auditUrl(d)}" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-ext"/></svg>${esc(t("openAudit",{d:t("dom."+d)}))}</a>`;

  if (d === "lab"){
    const note = i.labStatus === "plan" ? t("labPlanNote") : i.labStatus === "visit" ? t("labVisitNote") : i.labStatus === "none" ? t("labNoneNote") : "";
    return `<div style="margin-bottom:14px">${chip(k,l)}</div>
      <div class="kv"><div><span>${esc(t("dLabStaff"))}</span><b>${i.labStaff || "—"}</b></div><div><span>${esc(t("wil"))}</span><b style="font-size:16px">${esc(wn(i.wil))}</b></div></div>
      ${note ? `<p class="note" style="margin-top:12px"><svg aria-hidden="true"><use href="#i-info"/></svg>${esc(note)}</p>` : ""}

  }
  // radiology
  let h = `<div style="margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap">${chip(k,l)} ${i.R ? chip(...eqSt(i)) : ""}</div>
    <div class="kv"><div><span>${esc(t("dRad"))}</span><b>${i.radCur}</b><span>${esc(i.radSrc==="26"?t("src26"):t("src25"))}</span></div>
    <div><span>${esc(t("dNeed"))}</span><b>${i.radNeed}</b></div>
    <div><span>${esc(t("dTarget"))}</span><b>${i.radTarget}</b></div>
    ${i.R ? `<div><span>${esc(t("dMonthly"))}</span><b>${fmt(Math.round(i.R.monthly))}</b><span>${esc(t("dExams"))}: ${fmt(i.R.total)}</span></div>
    <div><span>${esc(t("dHours"))}</span><b>${i.R.hours}</b></div><div><span>${esc(t("dPacs"))}</span><b style="font-size:16px">${esc(i.R.pacs)} · ${i.R.tb} TB</b><span>${esc(t("localServer"))} · ${esc(t("dReporting"))}: ${esc(t("remote"))}</span></div>` : ""}</div>`;
  if (i.radNote) h += `<p class="note" style="margin-top:12px"><svg aria-hidden="true"><use href="#i-info"/></svg>${esc(t("note_"+i.radNote))}</p>`;

    h += `<h4 style="margin:20px 0 10px;font-size:14px">${esc(t("phases"))}</h4>` + legend([["var(--q700)",t("cur")],["var(--q550)",t("p1")],["var(--q400)",t("p2")],["var(--q250)",t("p3")]]) + `<div style="height:10px"></div>` +
      bars([{label:nm(i), segs:[{v:c,c:"var(--q700)"},{v:p1,c:"var(--q550)"},{v:p2,c:"var(--q400)"},{v:p3,c:"var(--q250)"}],
        tip:`${esc(t("cur"))}: ${c}<br>${esc(t("p1"))}: +${p1}<br>${esc(t("p2"))}: +${p2}<br>${esc(t("p3"))}: +${p3}`}], {max: Math.max(8, c+p1+p2+p3)});
  }
  if (i.r25 && i.r26) h += `<p class="sub" style="margin-top:10px">${esc(t("trend"))}: <b>${i.r25[0]} → ${i.r26[0]}</b></p>`;
  if (i.R){
    h += `<h4 style="margin:20px 0 10px;font-size:14px">${esc(t("equip"))}</h4><div class="tbl-wrap"><table><thead><tr><th>${esc(t("type"))}</th><th>${esc(t("vendorModel"))}</th><th class="num-c">${esc(t("installed"))}</th><th>${esc(t("status"))}</th></tr></thead><tbody>` +
      i.R.equip.map(e => `<tr><td>${esc(t("eqType."+e.type))}</td><td>${esc(e.vendor)} · ${esc(e.model)}</td><td class="num-c">${e.year}</td><td>${e.status==="condemn"?chip("crit",t("stEqCond")):e.age>=10?chip("warn",t("stEqOld",{a:e.age})):chip("good",t("stEqOk",{y:e.year}))}</td></tr>`).join("") + `</tbody></table></div>`;
  }
  h += `<div style="margin-top:16px">${auditBtn}</div><p class="src">${esc(t("srcS",{s:"Radiology template; radiographer lists Aug 2025 / Feb 2026"}))}</p>`;

function renderSheet(i){

/* ---------- compare ---------- */
VIEWS.compare = () => {
  const cols = [["inst",t("colInst"),w=>byWil(w).length],["lab",t("colLabOn"),w=>byWil(w).filter(i=>i.labStatus==="active").length],["labs",t("colLab"),w=>sum(byWil(w),i=>i.labStaff)],
    ["rad",t("colRad"),w=>sum(byWil(w),i=>i.radCur)],["need",t("colNeed"),w=>sum(byWil(w),i=>i.radNeed)],["units",t("colUnits"),w=>sum(byWil(w),i=>i.R&&i.R.equip.filter(e=>e.type==="xray").length)],["exams",t("colExams"),w=>sum(byWil(w),i=>i.R&&i.R.total)]];
  const [sk, sd] = UI.cmpSort; const sc = cols.find(c=>c[0]===sk) || cols[0];
  const rows = WLIST.slice().sort((a,b)=>(sc[2](a)-sc[2](b))*sd);
  const maxes = cols.map(c => Math.max(...WLIST.map(c[2])));
  const wtbl = `<div class="tbl-wrap"><table><thead><tr><th>${esc(t("wil"))}</th>${cols.map(c=>`<th class="num-c sortable" data-sort="${c[0]}">${esc(c[1])}${sk===c[0]?(sd<0?" ↓":" ↑"):""}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(w=>`<tr class="rowlink" data-go="wil:${esc(w)}"><td><b style="font-weight:600">${esc(wn(w))}</b></td>${cols.map((c,k)=>{const v=c[2](w);return `<td class="num-c"><span style="display:inline-flex;align-items:center;gap:8px;justify-content:flex-end"><span style="width:44px;height:6px;border-radius:3px;background:var(--track);display:inline-block;overflow:hidden"><span style="display:block;height:100%;width:${maxes[k]?v/maxes[k]*100:0}%;background:var(--s1)"></span></span>${fmt(v)}</span></td>`;}).join("")}</tr>`).join("")}
    <tr class="grp"><td>${esc(t("all"))}</td>${cols.map(c=>`<td class="num-c">${fmt(sum(WLIST,c[2]))}</td>`).join("")}</tr></tbody></table></div>`;
  const sel = UI.cmp.map(id=>INST.find(i=>i.id===id)).filter(Boolean);
  const metrics = [
    [t("wil"), i=>wn(i.wil), null],[t("type"), i=>t(i.type), null],
    [t("dom.lab"), i=>chip(...labSt(i)), null,1],[t("dLabStaff"), i=>i.labStaff, i=>i.labStaff],
    [t("dom.radiology"), i=>chip(...radSt(i)), null,1],[t("dRad"), i=>i.radCur, i=>i.radCur],[t("dNeed"), i=>i.radNeed, i=>i.radNeed],[t("dTarget"), i=>i.radTarget, i=>i.radTarget],
    [t("equip"), i=>chip(...eqSt(i)), null,1],[t("dMonthly"), i=>i.R?fmt(Math.round(i.R.monthly)):"—", i=>i.R?i.R.monthly:0],[t("dHours"), i=>i.R?i.R.hours:"—", i=>i.R?i.R.hours:0],
    [t("dom.general"), ()=>chip(...awaitSt()), null,1],[t("dom.dental"), ()=>chip(...awaitSt()), null,1],[t("dom.mental"), ()=>chip(...awaitSt()), null,1]
  ];
  const itbl = sel.length ? `<div class="tbl-wrap"><table><thead><tr><th>${esc(t("metric"))}</th>${sel.map(i=>`<th><span style="display:flex;align-items:center;gap:8px;justify-content:space-between"><a href="#inst-${i.id}" style="color:var(--ink);text-decoration:none;font-size:13px">${esc(nm(i))}</a><button type="button" class="badge" data-rm="${i.id}" aria-label="Remove" style="cursor:pointer">✕</button></span></th>`).join("")}</tr></thead><tbody>
    ${metrics.map(m => { const mx = m[2] ? Math.max(1,...sel.map(m[2])) : 0;
      return `<tr><td style="color:var(--muted)">${esc(m[0])}</td>${sel.map(i=>{ const v = m[1](i);
        const bar = m[2] ? `<span style="display:block;height:5px;border-radius:3px;background:var(--track);margin-top:6px;max-width:140px"><span style="display:block;height:100%;border-radius:3px;width:${m[2](i)/mx*100}%;background:var(--s1)"></span></span>` : "";
        return `<td>${m[3]?v:esc(v)}${bar}</td>`; }).join("")}</tr>`; }).join("")}</tbody></table></div>` : `<div class="empty">${esc(t("addInst"))}</div>`;
  const opts = INST.filter(i=>!UI.cmp.includes(i.id)).sort((a,b)=>nm(a).localeCompare(nm(b), LANG)).map(i=>`<option value="${i.id}">${esc(nm(i))} — ${esc(wn(i.wil))}</option>`).join("");
  return head(t("cmpEyebrow"), t("cmpTitle"), t("cmpSub")) +
    box(t("cmpWil"), "", wtbl, "", "Geographic list; lab staff list; radiology template") + `<div style="height:16px"></div>` +
    box(t("cmpInst"), t("maxFour"), `<div class="controls"><select class="select" id="addc" ${UI.cmp.length>=4?"disabled":""} style="min-width:260px"><option value="">${esc(t("addInst"))}</option>${opts}</select></div>${itbl}`);
};

/* ---------- gaps ---------- */
VIEWS.gaps = () => {
  const noLab = INST.filter(i=>i.labStatus==="none"||i.labStatus==="plan");
  const short = INST.filter(i=>i.radNeed>0).sort((a,b)=>b.radNeed-a.radNeed);
  const old = INST.filter(i=>i.R && (i.condemned || i.oldest>=10)).sort((a,b)=>b.oldest-a.oldest);
  const pipe = [...INST.filter(i=>i.labStatus==="plan").map(i=>[i,"lab",t("stLabPlan")]), ...INST.filter(i=>i.radNote).map(i=>[i,"radiology",t("note_"+i.radNote)])];
  const list = INST.filter(i=>!UI.gapWil || i.wil===UI.gapWil);
  const cols = ["lab","radiology","equip","general","dental","mental"];
  const colName = c => c==="equip" ? t("equip") : t("dom."+c);
  const cell = (i,c) => chip(...(c==="equip"?eqSt(i):domainSt(i,c)));
  const groups = WLIST.filter(w=>list.some(i=>i.wil===w));
  const matrix = `<div class="tbl-wrap" style="max-height:640px"><table><thead><tr><th>${esc(t("colInst"))}</th>${cols.map(c=>`<th>${esc(colName(c))}</th>`).join("")}</tr></thead><tbody>
    ${groups.map(w=>`<tr class="grp"><td colspan="${cols.length+1}">${esc(wn(w))} · ${byWil(w).length}</td></tr>` + list.filter(i=>i.wil===w).map(i=>`<tr class="rowlink" data-inst="${i.id}"><td><span style="font-weight:500">${esc(nm(i))}</span> <span class="badge">${esc(t(i.type))}</span></td>${cols.map(c=>`<td>${cell(i,c)}</td>`).join("")}</tr>`).join("")).join("")}</tbody></table></div>`;
  const lg = `<div class="legend" style="gap:8px">${[["good","lgGood"],["warn","lgWarn"],["serious","lgSerious"],["crit","lgCrit"],["info","lgInfo"],["none","lgNone"]].map(([k,l])=>chip(k,t(l))).join("")}</div>`;
  return head(t("gapEyebrow"), t("gapTitle"), t("gapSub")) +
  `<div class="grid g-4">
    ${kpi(t("gNoLab"), noLab.length, t("gNoLabS",{t:TOT.inst-TOT.pending,p:TOT.labPlan}))}
    ${kpi(t("gVisit"), TOT.labVisit, INST.filter(i=>i.labStatus==="visit").map(nm).map(esc).join(" · "))}
    ${kpi(t("gShort"), TOT.radNeed, `${short.length} ${esc(t("colInst"))}`)}
    ${kpi(t("gOld"), old.length, old.map(nm).map(esc).join(" · "))}
  </div>
  <div class="grid g-12" style="margin-top:16px">
    ${box(t("gShortT"), t("gShortS"), bars(short.map(i=>({label:nm(i), href:"inst:"+i.id, segs:[{v:i.radNeed,c:"var(--s2)"}], tip:`<b>${esc(nm(i))}</b><br>${esc(t("inPost"))}: ${i.radCur}<br>${esc(t("needNext"))}: +${i.radNeed}`}))), "span-5", "Radiographers Feb 2026 / Aug 2025")}
    ${box(t("gEqT"), t("gEqS"), `<div class="tbl-wrap"><table><tbody>${old.map(i=>i.R.equip.filter(e=>e.status==="condemn"||e.age>=10).map(e=>`<tr class="rowlink" data-inst="${i.id}"><td>${esc(nm(i))}<div class="sub">${esc(e.vendor)} · ${esc(e.model)}</div></td><td class="num-c">${e.year}</td><td>${e.status==="condemn"?chip("crit",t("stEqCond")):chip("warn",t("stEqOld",{a:e.age}))}</td></tr>`).join("")).join("")}</tbody></table></div>`, "span-7", "Radiology template — equipment inventory")}
    ${box(t("gPipeT"), t("gPipeS"), `<div class="tbl-wrap"><table><tbody>${pipe.map(([i,d,l])=>`<tr class="rowlink" data-inst="${i.id}"><td>${esc(nm(i))}<div class="sub">${esc(wn(i.wil))}</div></td><td><span style="display:inline-flex;align-items:center;gap:6px"><svg width="16" height="16" aria-hidden="true" style="color:var(--accent)"><use href="#${DOM_ICON[d]}"/></svg>${esc(t("dom."+d))}</span></td><td>${chip("info",l)}</td></tr>`).join("")}</tbody></table></div>`, "span-12")}
  </div>
  <div style="height:16px"></div>
  ${box(t("matrixT"), "", `<div class="controls" style="margin-bottom:12px">${wilSelect(UI.gapWil,'id="gwil"')}</div>${lg}<div style="height:14px"></div>${matrix}`)}`;
};

/* ---------- lab ---------- */
VIEWS.lab = () => {
  const list = INST.filter(i=>!i.pending && (!UI.labWil || i.wil===UI.labWil));
  const staffed = list.filter(i=>i.labStatus==="active").sort((a,b)=>b.labStaff-a.labStaff || nm(a).localeCompare(nm(b)));
  const rows = staffed.map(i=>({label:nm(i), href:"inst:"+i.id, segs:[{v:i.labStaff,c:"var(--s1)"}], tip:`<b>${esc(nm(i))}</b><br>${esc(wn(i.wil))}<br>${esc(t("dLabStaff"))}: ${i.labStaff}`}));
  const cov = WLIST.map(w=>{ const l=byWil(w).filter(i=>!i.pending), a=l.filter(i=>i.labStatus==="active").length, v=l.filter(i=>i.labStatus==="visit").length, p=l.filter(i=>i.labStatus==="plan").length;
    return {label:wn(w), href:"wil:"+w, segs:[{v:a,c:"var(--s1)"},{v:v,c:"var(--s4)"},{v:p,c:"var(--q250)"},{v:l.length-a-v-p,c:"var(--track)"}], vLabel:`${Math.round(a/l.length*100)}%`,
      tip:`<b>${esc(wn(w))}</b><br>${esc(t("lActive"))}: ${a}<br>${esc(t("lVisit"))}: ${v}<br>${esc(t("lPlan"))}: ${p}<br>${esc(t("lNone"))}: ${l.length-a-v-p}`}; });
  const lst = (st) => INST.filter(i=>i.labStatus===st && (!UI.labWil||i.wil===UI.labWil)).map(i=>`<button type="button" class="chip st-${st==="plan"?"info":st==="visit"?"warn":"none"}" data-inst="${i.id}" style="border:0;cursor:pointer"><svg aria-hidden="true"><use href="#${st==="plan"?"i-info":st==="visit"?"i-warn":"i-dash"}"/></svg>${esc(nm(i))}</button>`).join(" ") || "—";
  return head(t("labEyebrow"), t("labTitle"), t("labSub"), wilSelect(UI.labWil, 'id="lwil"')) +
  `<div class="grid g-4">
    ${kpi(t("kLab"), sum(list,i=>i.labStaff), "")}
    ${kpi(t("lActive"), staffed.length, `/ ${list.length}`)}
    ${kpi(t("lVisit"), list.filter(i=>i.labStatus==="visit").length, "")}
    ${kpi(t("lPlan"), list.filter(i=>i.labStatus==="plan").length, "")}
  </div>
  <div class="grid g-12" style="margin-top:16px">
    ${box(t("lBarT"), t("lBarS"), bars(rows), "span-7", "Laboratory staff list")}
    <div class="span-5 grid" style="align-content:start">
      ${box(t("lWilT"), t("lWilS"), legend([["var(--s1)",t("lActive")],["var(--s4)",t("lVisit")],["var(--q250)",t("lPlan")],["var(--track)",t("lNone")]]) + `<div style="height:12px"></div>` + bars(cov))}
      ${box(t("lPlan"), "", lst("plan"))}
      ${box(t("lVisit"), "", lst("visit"))}
      ${box(t("lNone"), "", lst("none"))}
    </div>
  </div>`;
};

/* ---------- radiology ---------- */
VIEWS.radiology = () => {
  const plan = INST.filter(i=>i.radTarget>0).sort((a,b)=>b.radTarget-a.radTarget);
  const planRows = plan.map(i=>{ const r = i.r25 || [i.radCur,i.radNeed,0,0];
    return {label:nm(i), href:"inst:"+i.id, segs:[{v:r[0],c:"var(--q700)"},{v:r[1],c:"var(--q550)"},{v:r[2],c:"var(--q400)"},{v:r[3],c:"var(--q250)"}], vLabel:`${i.radTarget}`,
      tip:`<b>${esc(nm(i))}</b><br>${esc(t("cur"))}: ${r[0]}<br>${esc(t("p1"))}: +${r[1]}<br>${esc(t("p2"))}: +${r[2]}<br>${esc(t("p3"))}: +${r[3]}<br>${esc(t("dTarget"))}: ${i.radTarget}`}; });
  const tr = INST.filter(i=>i.r25 && i.r26).sort((a,b)=>(b.r26[0]-b.r25[0])-(a.r26[0]-a.r25[0]) || b.r26[0]-a.r26[0]);
  const tmax = Math.max(...tr.map(i=>Math.max(i.r25[0],i.r26[0])), 1);
  const trend = `<div class="bars">${tr.map(i=>{ const a=i.r25[0], b=i.r26[0], lo=Math.min(a,b), hi=Math.max(a,b);
    const d = b-a; const dl = d===0?"=":(d>0?`+${d}`:`${d}`);
    return `<div class="bar-row clickable" data-go="inst:${i.id}" data-tip="${esc(`<b>${esc(nm(i))}</b><br>Aug 2025: ${a}<br>Feb 2026: ${b}`)}"><span class="bl">${esc(nm(i))}</span>
      <span class="dumb"><span class="ln" style="inset-inline-start:${lo/tmax*100}%;width:${(hi-lo)/tmax*100}%"></span><span class="pt" style="inset-inline-start:${a/tmax*100}%;background:var(--surface);border:2px solid var(--muted)"></span><span class="pt" style="inset-inline-start:${b/tmax*100}%;background:var(--s1)"></span></span>
      <span class="bv" style="color:${d<0?"var(--crit)":"var(--ink)"}">${dl}</span></div>`; }).join("")}</div>`;
  const R = INST.filter(i=>i.R);
  const vol = R.slice().sort((a,b)=>b.R.monthly-a.R.monthly).map(i=>({label:nm(i), href:"inst:"+i.id, segs:[{v:Math.round(i.R.monthly),c:"var(--s1)"}], tip:`<b>${esc(nm(i))}</b><br>${esc(t("dExams"))}: ${fmt(i.R.xr)} (${i.R.months} mo)<br>${esc(t("dMonthly"))}: ${fmt(Math.round(i.R.monthly))}${i.R.ct?`<br>CT: ${fmt(i.R.ct)}`:""}`}));
  const per = R.filter(i=>i.radCur>0).map(i=>({i, v:i.R.monthly/i.radCur})).sort((a,b)=>b.v-a.v).map(({i,v})=>({label:nm(i), href:"inst:"+i.id, segs:[{v:Math.round(v),c:"var(--s3)"}], tip:`<b>${esc(nm(i))}</b><br>${fmt(Math.round(i.R.monthly))} ÷ ${i.radCur} = ${fmt(Math.round(v))}`}));
  const eq = R.flatMap(i=>i.R.equip.map(e=>({i,e}))).sort((a,b)=>a.e.year-b.e.year);
  const eqT = `<div class="tbl-wrap" style="max-height:460px"><table><thead><tr><th>${esc(t("colInst"))}</th><th>${esc(t("type"))}</th><th>${esc(t("vendorModel"))}</th><th class="num-c">${esc(t("installed"))}</th><th>${esc(t("age"))}</th><th>${esc(t("status"))}</th></tr></thead><tbody>
    ${eq.map(({i,e})=>`<tr class="rowlink" data-inst="${i.id}"><td>${esc(nm(i))}</td><td>${esc(t("eqType."+e.type))}</td><td>${esc(e.vendor)} · ${esc(e.model)}</td><td class="num-c">${e.year}</td>
      <td><span style="display:inline-flex;align-items:center;gap:8px"><span style="width:90px;height:6px;border-radius:3px;background:var(--track);overflow:hidden;display:inline-block"><span style="display:block;height:100%;width:${Math.min(e.age/17*100,100)}%;background:${e.status==="condemn"?"var(--crit)":e.age>=10?"var(--warn)":"var(--s1)"}"></span></span>${e.age}</span></td>
      <td>${e.status==="condemn"?chip("crit",t("stEqCond")):e.age>=10?chip("warn",t("stEqOld",{a:e.age})):chip("good",t("stEqOk",{y:e.year}))}</td></tr>`).join("")}</tbody></table></div>`;
  const qTot = QUAL.Diploma + QUAL.BSc + QUAL.MSc;
  const qual = legend([["var(--s1)",`Diploma ${QUAL.Diploma}`],["var(--s2)",`BSc ${QUAL.BSc}`],["var(--s3)",`MSc ${QUAL.MSc}`]]) +
    `<div style="display:flex;gap:2px;height:22px;margin-top:12px">${[["Diploma","var(--s1)"],["BSc","var(--s2)"],["MSc","var(--s3)"]].map(([k,c])=>`<span data-tip="<b>${k}</b><br>${QUAL[k]} (${Math.round(QUAL[k]/qTot*100)}%)" style="width:${QUAL[k]/qTot*100}%;background:${c};border-radius:4px"></span>`).join("")}</div>`;
  const hours = R.slice().sort((a,b)=>b.R.hours-a.R.hours).map(i=>({label:nm(i), href:"inst:"+i.id, segs:[{v:i.R.hours,c:"var(--q550)"}], tip:`<b>${esc(nm(i))}</b><br>${i.R.hours} h / week<br>PACS: ${esc(i.R.pacs)} · ${i.R.tb} TB`}));
  const tpl = `<div class="bars">${TEMPLATE_SECTIONS.map(([s,v])=>`<div class="bar-row" style="grid-template-columns:minmax(140px,200px) 1fr auto"><span class="bl">${esc(LANG==="ar"?TPL_AR[s]:s)}</span><span class="bar-track"><span class="seg" style="width:${Math.max(v*100,1)}%;background:${v===1?"var(--good)":v>0?"var(--warn)":"var(--line-2)"}"></span></span><span>${v===1?chip("good",t("filled")):v>0?chip("warn",t("partial")):chip("none",t("empty"))}</span></div>`).join("")}</div>`;
  return head(t("radEyebrow"), t("radTitle"), t("radSub")) +
  `<div class="grid g-4">
    ${kpi(t("rCur"), TOT.radCur, t("kRadS",{n:TOT.radNeed}))}
    ${kpi(t("rTarget"), TOT.radTarget, "")}
    ${kpi(t("kExam"), fmt(TOT.exams), "")}
    ${kpi(t("rUnits"), TOT.xrayRooms+TOT.mobile+TOT.ct, t("rUnitsS",{x:TOT.xrayRooms,m:TOT.mobile,c:TOT.ct}))}
  </div>
  <div class="grid g-12" style="margin-top:16px">
    ${box(t("rPlanT"), t("rPlanS"), legend([["var(--q700)",t("cur")],["var(--q550)",t("p1")],["var(--q400)",t("p2")],["var(--q250)",t("p3")]]) + `<div style="height:12px"></div>` + bars(planRows), "span-7", "Radiographers & 3-phase need, Aug 2025")}
    ${box(t("rTrendT"), t("rTrendS"), `<div class="legend"><span><i class="ring"></i>Aug 2025</span><span><i style="background:var(--s1);border-radius:50%"></i>Feb 2026</span></div><div style="height:12px"></div>` + trend, "span-5", "Aug 2025 & Feb 2026 lists")}
    ${box(t("rVolT"), t("rVolS"), bars(vol), "span-6", "Radiology template — exam volume")}
    ${box(t("rPerT"), t("rPerS"), bars(per), "span-6", "Exam volume ÷ radiographers")}
    ${box(t("rEqT"), t("rEqS"), eqT, "span-12", "Radiology template — equipment inventory")}
    ${box(t("rHoursT"), t("rHoursS"), bars(hours), "span-6", "Radiology template — facility overview")}
    <div class="span-6 grid" style="align-content:start">
      ${box(t("rQualT"), t("rQualS"), qual, "", "Radiology template — workforce (aggregated)")}
      ${box(t("rTplT"), t("rTplS"), tpl)}
    </div>
  </div>`;
};

const TPL_AR = {"Facility Overview":"نظرة عامة على المنشأة","Workforce":"القوى العاملة","Equipment Inventory":"سجل الأجهزة","Exam Volume":"حجم الفحوصات","PACS & Archive":"PACS والأرشيف","Digital Maturity":"النضج الرقمي","Turnaround Time":"زمن إنجاز التقارير","Reporting & Workflow":"التقارير وسير العمل","Quality & Audit":"الجودة والتدقيق","Demand & Coverage":"الطلب والتغطية","Readiness & Training":"الجاهزية والتدريب","Clinical Effectiveness":"الفعالية السريرية","Equity & Access":"العدالة والوصول","Cost & Utilization":"التكلفة والاستخدام","Accreditation & Risk":"الاعتماد والمخاطر","Upcoming Projects":"المشاريع القادمة"};
/* ---------- audits ---------- */
VIEWS.audits = () => {
  const cards = AUDITS.map(a=>`<a class="box acard fade-in" href="${a.url}" target="_blank" rel="noopener"><span class="ic"><svg aria-hidden="true"><use href="#${DOM_ICON[a.key]}"/></svg></span><h3>${esc(t("dom."+a.key))}</h3><p>${esc(t("aDesc."+a.key))}</p><span class="go">${esc(t("aOpen"))} <svg width="14" height="14" aria-hidden="true"><use href="#i-ext"/></svg></span></a>`).join("");
  return head(t("audEyebrow"), t("audTitle"), t("audSub")) +
  `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${cards}</div>`;
};

/* ---------- data notes ---------- */
VIEWS.data = () => head(t("datEyebrow"), t("datTitle"), "") +
  `<div class="grid g-2">
    ${box(t("sources"), "", `<div class="tbl-wrap"><table><tbody>${t("srcList").map(([a,b])=>`<tr><td style="white-space:normal">${esc(a)}</td><td style="white-space:normal;color:var(--muted)">${esc(b)}</td></tr>`).join("")}</tbody></table></div>`)}
    <div class="grid" style="align-content:start">
      ${box(t("deid"), "", `<p class="note"><svg aria-hidden="true"><use href="#i-check"/></svg>${esc(t("deidTxt"))}</p>`)}
      ${box(t("caveats"), "", `<ul style="padding-inline-start:18px;display:grid;gap:8px;font-size:13.5px;color:var(--ink-2);line-height:1.55">${t("cav").map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`)}
    </div>
  </div>`;

/* ===================== router & chrome ===================== */
const ROUTES = ["overview","institutions","compare","gaps","lab","radiology","audits","data"];
let ROUTE = null;
function applyStatic(){
  $$("[data-i]").forEach(el => { const v = t(el.dataset.i); if (typeof v === "string") el.innerHTML = v; });
  $("#tabs").innerHTML = ROUTES.map(r=>`<a href="#${r}"${ROUTE===r?' aria-current="page"':""}>${esc(t("tabs."+r))}</a>`).join("");
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  $$(".js-theme use").forEach(u => u.setAttribute("href", dark ? "#i-sun" : "#i-moon"));
  $$(".js-lang").forEach(b => b.setAttribute("aria-label", LANG==="ar" ? "Switch to English" : "التبديل إلى العربية"));
  document.title = LANG === "ar" ? "خدمات ظفار الصحية" : "Dhofar Health Services";
  $("#heroN1").textContent = TOT.inst;
  $("#heroN2").textContent = fmt(WORKFORCE.total);
  $("#heroN3").textContent = Math.round(POPULATION.total / 1000) + "K";
  $("#heroN3").title = fmt(POPULATION.total);
  $("#heroTrack").style.setProperty("--fill", ((TOT.labActive+TOT.labVisit)/(TOT.inst-TOT.pending)*100).toFixed(1)+"%");
  const mc = document.querySelector('meta[name="theme-color"]'); if (mc) mc.content = dark ? "#081020" : "#E6EDF6";
}
function bindView(){
  if (ROUTE === "institutions"){
    renderCards();
    $("#q").addEventListener("input", e => { UI.q = e.target.value; renderCards(); });
    $("#fwil").addEventListener("change", e => { UI.wil = e.target.value; renderCards(); });
    $("#fsvc").addEventListener("change", e => { UI.svc = e.target.value; renderCards(); });
  }
  if (ROUTE === "compare"){ const a = $("#addc"); a && a.addEventListener("change", e => { if (e.target.value && UI.cmp.length < 4){ UI.cmp.push(e.target.value); render(); } }); }
  if (ROUTE === "gaps") $("#gwil").addEventListener("change", e => { UI.gapWil = e.target.value; render(); });
  if (ROUTE === "lab") $("#lwil").addEventListener("change", e => { UI.labWil = e.target.value; render(); });
}
function render(){
  const h = (location.hash || "").replace("#","");
  const isHome = !h || h === "home";
  document.body.classList.toggle("is-home", isHome);
  let instId = null, r = h;
  if (h.startsWith("inst-")){ instId = h.slice(5); r = "institutions"; }
  if (!isHome && !ROUTES.includes(r)) r = "overview";
  const changed = ROUTE !== (isHome ? "home" : r);
  ROUTE = isHome ? "home" : r;
  applyStatic();
  if (!isHome){
    const y = changed ? 0 : window.scrollY;
    $("#view").innerHTML = VIEWS[r]();
    bindView();
    if (changed) window.scrollTo(0, 0); else window.scrollTo(0, y);
  }
  if (instId) openInst(instId); else if (changed) closeModal();
  else { const m = $("#modal"); if (m.hasAttribute("open")) { const i = INST.find(x=>x.id===m.dataset.inst); i && renderSheet(i); } }
}
function go(target){
  if (target.startsWith("wil:")){ UI.wil = target.slice(4); UI.q = ""; UI.type = ""; UI.svc = ""; if (location.hash === "#institutions") render(); else location.hash = "institutions"; }
  else if (target.startsWith("inst:")) openInst(target.slice(5));
}
let toastT;
function toast(msg){ const el = $("#toast"); el.textContent = msg; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("on"), 2200); }

/* global events */
document.addEventListener("click", e => {
  const T_ = e.target;
  const th = T_.closest(".js-theme");
  if (th){ const d = document.documentElement; const nx = d.getAttribute("data-theme") === "dark" ? "light" : "dark"; d.setAttribute("data-theme", nx); store.set("dha-theme", nx); try{localStorage.setItem("dha-theme", nx)}catch(_){} applyStatic(); return; }
  const lg = T_.closest(".js-lang");
  if (lg){ LANG = LANG === "ar" ? "en" : "ar"; const d = document.documentElement; d.lang = LANG; d.dir = LANG === "ar" ? "rtl" : "ltr"; try{localStorage.setItem("dha-lang", LANG)}catch(_){} render(); return; }
  if (T_.closest("[data-close]")){ closeModal(); return; }
  const dt = T_.closest("[data-dtab]");
  if (dt){ DETAIL_TAB = dt.dataset.dtab; const i = INST.find(x=>x.id===$("#modal").dataset.inst); i && renderSheet(i); return; }
  const ic = T_.closest("[data-inst]");
  if (ic){ openInst(ic.dataset.inst); return; }
  const g = T_.closest("[data-go]");
  if (g){ go(g.dataset.go); return; }
  const bub = T_.closest(".bub");
  if (bub){ go("wil:" + bub.dataset.wil); return; }
  const sg = T_.closest("[data-seg]");
  if (sg){ const k = sg.dataset.seg, v = sg.dataset.v;
    if (k === "type"){ UI.type = v; $$('[data-seg="type"]').forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===v)); renderCards(); }
    return; }
  const so = T_.closest("[data-sort]");
  if (so){ const k = so.dataset.sort; UI.cmpSort = UI.cmpSort[0] === k ? [k, -UI.cmpSort[1]] : [k, -1]; render(); return; }
  const rm = T_.closest("[data-rm]");
  if (rm){ UI.cmp = UI.cmp.filter(x=>x!==rm.dataset.rm); render(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("bub")){ e.preventDefault(); go("wil:" + e.target.dataset.wil); }
});
/* tooltip */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest && e.target.closest("[data-tip]");
  if (!el){ tip.classList.remove("on"); return; }
  tip.innerHTML = el.dataset.tip; tip.classList.add("on");
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});
document.addEventListener("scroll", () => tip.classList.remove("on"), { passive:true });
window.addEventListener("hashchange", render);
render();

/* ===================== hero motion & menu ===================== */
(function(){
  const d = document.documentElement; if (!d.classList.contains("pre")) return;
  const EXPO = "cubic-bezier(.16,1,.3,1)", SOFT = "cubic-bezier(.22,.7,.25,1)", GLASS = "cubic-bezier(.2,.75,.28,1)";
  const s = matchMedia("(max-width: 640px)").matches ? .86 : 1, running = [];
  const q = x => typeof x === "string" ? $(".hero " + x) : x;
  const an = (el, kf, dur, delay, easing) => { el = q(el); if (!el) return; running.push(el.animate(kf, { duration:dur*s, delay:delay*s, easing, fill:"both" })); };
  const rise = (el, delay, dur) => an(el, [{clipPath:"inset(100% 0 -14% 0)",translate:"0 .16em"},{clipPath:"inset(-18% 0 -14% 0)",translate:"0 0"}], dur, delay, EXPO);
  const lift = (el, delay, dist=".7em", dur=560) => an(el, [{opacity:0,translate:"0 "+dist},{opacity:1,translate:"0 0"}], dur, delay, SOFT);
  const settle = (el, delay, dur=760, from=.985, dist="1.1em") => an(el, [{opacity:0,scale:from,translate:"0 "+dist},{opacity:1,scale:1,translate:"0 0"}], dur, delay, GLASS);
  an(".stage", [{opacity:0,scale:.96},{opacity:1,scale:1}], 1400, 0, EXPO);
  lift(".brand",60,".55em",600); settle(".nav",150,700,.99,".5em"); settle(".cta",200,700,.985,".5em"); settle(".toggles",180,700,.96,".5em"); settle(".burger",150,700,.9,".4em");
  lift(".eyebrow",300,".8em",520);
  const hs = $$(".hero h1 .sx"); rise(hs[0],380,980); rise(hs[1],470,980);
  settle(".play",720,640,.88,".3em"); lift(".tag",770,".7em",560); settle(".panel",800,880,.982,"1.4em");
  an(".shield",[{scale:.86},{scale:1}],700,1020,EXPO); an(".dot",[{scale:0},{scale:1}],520,1080,EXPO); an(".track i",[{scale:"0 1"},{scale:"1 1"}],820,1120,EXPO);
  const ns = $$(".hero .num"), ls = $$(".hero .lbl"); rise(ns[0],920,860); rise(ns[1],990,860); lift(ls[0],1030,".6em",520); lift(ls[1],1075,".6em",520);
  an(".slash",[{scale:"1 0"},{scale:"1 1"}],700,1010,EXPO); settle(".meet",1140,820,.985,"1.2em");
  Promise.all(running.map(a=>a.finished.catch(()=>{}))).then(()=>{ d.classList.remove("pre"); running.forEach(a=>a.cancel()); running.length = 0; });
})();
(function(){
  const btn = $(".hero .burger"), menu = $("#site-menu"); if (!btn || !menu) return;
  const set = o => { btn.setAttribute("aria-expanded", String(o)); o ? menu.setAttribute("data-open","") : menu.removeAttribute("data-open"); };
  btn.addEventListener("click", e => { e.stopPropagation(); set(btn.getAttribute("aria-expanded") !== "true"); });
  menu.addEventListener("click", e => { if (e.target.closest("a")) set(false); });
  document.addEventListener("click", e => { if (!btn.contains(e.target) && !menu.contains(e.target)) set(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && btn.getAttribute("aria-expanded") === "true"){ set(false); btn.focus(); } });
  matchMedia("(min-aspect-ratio: 1/1)").addEventListener("change", m => { if (m.matches) set(false); });
})();
})();

/* background video: show it when it can play; otherwise the glass-sphere fallback stays */
(() => {
  const $ = s => document.querySelector(s); const v = $("#bgv"), card = $("#herocard"); if (!v || !card) return;
  const q = matchMedia("(prefers-reduced-motion: reduce)");
  const on = () => card.classList.add("has-video");
  const sync = () => { if (q.matches){ v.pause(); v.currentTime = 0; } else v.play().catch(() => {}); };
  v.addEventListener("loadeddata", on);
  v.addEventListener("playing", on);
  v.addEventListener("error", () => card.classList.remove("has-video"));
  q.addEventListener("change", sync);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
  v.addEventListener("canplay", sync); sync();
  if (v.readyState >= 2) on();
})();
</script>
